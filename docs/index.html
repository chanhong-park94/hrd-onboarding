<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>운영진 온보딩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <div class="in">
    <button class="brand" id="goHome" type="button" aria-label="홈으로"><span class="seal" id="brandSeal">결재</span><b id="brandName">운영진 온보딩</b></button>
    <nav class="nav" id="nav" aria-label="메뉴">
      <button type="button" data-go="home">홈</button>
      <button type="button" data-go="path">학습</button>
      <button type="button" data-go="guide">운영 가이드</button>
      <button type="button" data-go="tools">업무 도구</button>
      <button type="button" data-go="library">자료실</button>
      <button type="button" data-go="badges">내 정보</button>
    </nav>
    <div class="lvl">
      <span class="sync" id="sync"></span>
      <span class="chip" id="lvlChip">Lv.1 수습</span>
      <div class="xpbar" aria-hidden="true"><i id="xpFill"></i></div>
      <span class="mono" id="xpText">0 XP</span>
      <span class="streak" id="streak"></span>
    </div>
  </div>
</header>
<section class="wrap gate" id="gate" hidden></section>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
