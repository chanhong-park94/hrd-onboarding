<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>훈련운영 결재 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F3F4EF; --sheet:#FFFFFF; --ink:#1D2733; --ink-2:#4B5664; --ink-3:#7A8491;
  --rule:#D8DCD3; --rule-2:#E7EAE3;
  --stamp:#C4332A; --stamp-soft:#F7E4E1;
  --ok:#2E7A57; --ok-soft:#E1F0E7; --no:#8C5A12; --no-soft:#F6ECD8;
  --gold:#A87A1F; --focus:#2F5DA8;
  --shadow:0 1px 0 rgba(29,39,51,.06), 0 8px 24px -16px rgba(29,39,51,.35);
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --f-stamp:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12161B; --sheet:#1A2027; --ink:#E7EAEE; --ink-2:#A6AFBA; --ink-3:#7C8693;
    --rule:#2C343E; --rule-2:#232A33;
    --stamp:#E3574C; --stamp-soft:#3A1F1C;
    --ok:#55B887; --ok-soft:#163226; --no:#D8A444; --no-soft:#3A2C12;
    --gold:#D9AE52; --focus:#86AAE8;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161B; --sheet:#1A2027; --ink:#E7EAEE; --ink-2:#A6AFBA; --ink-3:#7C8693;
  --rule:#2C343E; --rule-2:#232A33;
  --stamp:#E3574C; --stamp-soft:#3A1F1C;
  --ok:#55B887; --ok-soft:#163226; --no:#D8A444; --no-soft:#3A2C12;
  --gold:#D9AE52; --focus:#86AAE8;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,36px)} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-2)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:880px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand .seal{width:30px;height:30px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-stamp);font-size:12px;transform:rotate(-10deg)}
.brand b{font-family:var(--f-display);font-size:16px}
.lvl{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.lvl .chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);white-space:nowrap}
.xpbar{width:130px;height:8px;border-radius:99px;background:var(--rule-2);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s ease}
.streak{font-size:12px;color:var(--stamp);font-weight:700;white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:14px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule)}

/* layout pieces */
.view{padding-top:28px;display:grid;gap:22px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.danger{background:transparent;color:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* home hero with approval boxes */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.hero p.lead{font-size:16px;color:var(--ink-2);margin-top:10px;max-width:46ch}
.gyeoljae{border:1.5px solid var(--ink);border-radius:4px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--sheet)}
.gyeoljae div{border-left:1px solid var(--ink);display:grid;grid-template-rows:26px 78px;text-align:center}
.gyeoljae div:first-child{border-left:0}
.gyeoljae span{font-size:12px;border-bottom:1px solid var(--ink);display:grid;place-items:center;letter-spacing:.1em}
.gyeoljae em{font-style:normal;display:grid;place-items:center;position:relative}
.gyeoljae small{position:absolute;bottom:4px;left:0;right:0;font-size:10.5px;color:var(--ink-3);padding:0 4px;line-height:1.3}
.seal-mini{width:50px;height:50px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);font-family:var(--f-stamp);font-size:15px;display:grid;place-items:center;transform:rotate(-14deg);margin-top:-12px;opacity:.9}
.gcap{font-size:12px;color:var(--ink-3);margin-top:8px}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule)}
.stats div{padding:14px 18px;border-left:1px solid var(--rule)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--f-mono);font-size:22px}
.stats span{font-size:12px;color:var(--ink-3)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--rule)}}

/* mode tiles */
.mode{text-align:left;cursor:pointer;display:grid;gap:6px;padding:18px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet)}
.mode:hover{border-color:var(--ink-2)}
.mode .k{font-family:var(--f-mono);font-size:12px;color:var(--stamp)}
.mode .st{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.35}
.mode .sd{font-size:13.5px;color:var(--ink-2)}

/* curriculum path */
.path{display:grid}
.step{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px 18px;border-top:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.step:first-child{border-top:0}
.step:hover{background:color-mix(in srgb,var(--paper) 55%,var(--sheet))}
.step .no{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.step .st{display:block;font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.35}
.step .sd{display:block;font-size:13px;color:var(--ink-2)}
.meter{height:6px;border-radius:99px;background:var(--rule-2);overflow:hidden;margin-top:8px;max-width:260px}
.meter i{display:block;height:100%;background:var(--ok)}
.badge-seal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-stamp);font-size:11px;line-height:1.1;text-align:center;border:1.5px dashed var(--rule);color:var(--ink-3);padding:4px}
.badge-seal.on{border:2.5px solid var(--stamp);color:var(--stamp);transform:rotate(-10deg)}

/* lesson cards */
.cards{display:grid;gap:12px}
.card{padding:16px 18px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);display:grid;grid-template-columns:auto 1fr;gap:14px}
.card .n{font-family:var(--f-mono);font-size:12px;color:var(--stamp);padding-top:3px}
.card b.key{background:var(--stamp-soft);color:var(--ink);padding:0 4px;border-radius:4px;font-weight:700}
.card .ref{display:block;margin-top:6px;font-size:12px;color:var(--ink-3)}

/* quiz */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;border:1px solid var(--rule);color:var(--ink-2);background:var(--paper)}
.tag.sit{border-color:var(--stamp);color:var(--stamp)}
.qprog{height:4px;background:var(--rule-2);border-radius:9px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qtext{font-size:18px;line-height:1.6;font-weight:500;margin-top:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 16px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt .lt{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);padding-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{grid-template-columns:1fr;text-align:center;font-family:var(--f-stamp);font-size:34px;padding:18px}
.fb{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:16px 18px;border-radius:12px;border:1px solid var(--rule);background:var(--paper)}
.fb p{font-size:14.5px}
.fb .ref{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.stampbox{width:86px;height:86px;display:grid;place-items:center}
.stamp{font-family:var(--f-stamp);font-size:22px;display:grid;place-items:center;transform:rotate(-12deg);animation:stampin .35s cubic-bezier(.2,1.4,.4,1) both}
.stamp.yes{width:80px;height:80px;border-radius:50%;border:3.5px solid var(--stamp);color:var(--stamp);box-shadow:inset 0 0 0 3px var(--sheet),inset 0 0 0 4.5px var(--stamp)}
.stamp.no{padding:6px 10px;border:3px solid var(--ink-2);color:var(--ink-2);border-radius:4px;font-size:24px}
@keyframes stampin{from{transform:scale(1.8) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.xpbar i,.qprog i{transition:none}}

/* results & certificate */
.big{font-family:var(--f-mono);font-size:44px;line-height:1}
.passline{position:relative;height:12px;border-radius:99px;background:var(--rule-2);overflow:visible;margin-top:12px}
.passline i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.passline .mk{position:absolute;left:80%;top:-5px;bottom:-5px;width:2px;background:var(--stamp)}
.passline .lb{position:absolute;left:80%;top:16px;transform:translateX(-50%);font-size:11px;color:var(--stamp);font-style:normal;white-space:nowrap}
.opt.picked{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cert{position:relative;padding:34px 30px;border:1.5px solid var(--ink);outline:1px solid var(--ink);outline-offset:-8px;background:var(--sheet);text-align:center;display:grid;gap:12px}
.cert h2{font-size:30px;letter-spacing:.3em}
.cert .body{max-width:40ch;margin:0 auto;font-size:15.5px}
.cert .seal-big{position:absolute;right:26px;bottom:22px;width:84px;height:84px;border-radius:50%;border:3.5px solid var(--stamp);color:var(--stamp);font-family:var(--f-stamp);display:grid;place-items:center;font-size:15px;transform:rotate(-14deg);line-height:1.15}

/* speed */
.timer{height:10px;border-radius:99px;background:var(--rule-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--stamp);transition:width .2s linear}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{display:grid;justify-items:center;gap:8px;padding:16px 10px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);text-align:center}
.bdg .badge-seal{width:64px;height:64px;font-size:13px}
.bdg b{font-size:13.5px}
.bdg small{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.levels{display:grid;gap:0}
.levels div{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--rule);font-size:14px}
.levels div.cur{font-weight:700}
.field{display:grid;gap:6px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);max-width:320px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.confirm{border:1px solid var(--stamp);background:var(--stamp-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.list{display:grid;gap:10px}
.wrongitem{padding:14px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);display:grid;gap:6px}
.wrongitem small{color:var(--ink-3)}
</style>
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.brand-logo{height:30px;width:auto}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
.gate{padding-block:48px 64px}
.gate-card{max-width:460px;margin:0 auto;padding:30px 26px;display:grid;gap:14px}
.gate-seal{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-stamp);font-size:15px;transform:rotate(-10deg)}
.gate-logo{height:56px;width:auto;justify-self:start}
.gate-form{display:grid;gap:14px;margin-top:4px}
.gate .field input{max-width:none;width:100%}
.gate .field small{font-size:12.5px;line-height:1.5}
.gate-msg{color:var(--stamp);font-size:14px;min-height:1.4em;margin:0}
.gate-note{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--no-soft);color:var(--ink)}
.gate-foot{display:flex;justify-content:flex-end}
.linkbtn{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0;font-size:14px}
.admin{max-width:none;display:grid;gap:14px}
.admin .field input{max-width:220px}
.tablewrap{overflow-x:auto;margin-top:10px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.adt{border-collapse:collapse;width:100%;font-size:13.5px;min-width:780px}
.adt th,.adt td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap;vertical-align:middle}
.adt th{font-size:12px;color:var(--ink-3);font-weight:500;background:var(--paper)}
.adt td.sc{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.adt td.sc.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.adt td.sc.mid{background:var(--no-soft);color:var(--no)}
.adt td.nm{font-weight:700}
.adt .pass{color:var(--ok)}
.cert-logo{height:44px;width:auto;margin:0 auto}
</style>
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <div class="in">
    <button class="brand" id="goHome" type="button" aria-label="홈으로"><span class="seal" id="brandSeal">결재</span><b id="brandName">운영진 온보딩</b></button>
    <nav class="nav" id="nav" aria-label="메뉴">
      <button type="button" data-go="home">홈</button>
      <button type="button" data-go="path">학습 경로</button>
      <button type="button" data-go="wrong">오답 노트</button>
      <button type="button" data-go="badges">내 정보</button>
    </nav>
    <div class="lvl">
      <span class="sync" id="sync"></span>
      <span class="chip" id="lvlChip">Lv.1 수습</span>
      <div class="xpbar" aria-hidden="true"><i id="xpFill"></i></div>
      <span class="mono" id="xpText">0 XP</span>
      <span class="streak" id="streak"></span>
    </div>
  </div>
</header>
<section class="wrap gate" id="gate" hidden></section>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
